{% extends "base.html" %}
{% block titulo %}Iniciar sesion{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 text-verde">EcoPunto</h1>
        <p class="text-muted small mb-4">Gestion y trazabilidad de residuos reciclables</p>
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="correo">Correo institucional</label>
            <input type="email" class="form-control" id="correo" name="correo" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="contrasena">Contrasena</label>
            <input type="password" class="form-control" id="contrasena" name="contrasena" required>
          </div>
          <button class="btn btn-verde w-100" type="submit">Ingresar</button>
        </form>
        <hr>
        <p class="small text-muted mb-0">
          <strong>Usuarios de prueba</strong><br>
          admin@umb.edu.co / Admin2026*<br>
          laura.gomez@umb.edu.co / Eco2026*
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
