{% extends "base.html" %}
{% block titulo %}{{ accion }} residuo{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4">{{ accion }} residuo reciclable</h1>
<div class="card"><div class="card-body">
<form method="post" novalidate>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="id_punto">Punto de reciclaje *</label>
      <select class="form-select" id="id_punto" name="id_punto" required>
        <option value="">Seleccione...</option>
        {% for p in puntos %}
          <option value="{{ p.id_punto }}"
            {% if registro and registro.id_punto|string == p.id_punto|string %}selected{% endif %}>
            {{ p.nombre }} - {{ p.localidad }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="id_tipo">Tipo de residuo *</label>
      <select class="form-select" id="id_tipo" name="id_tipo" required>
        <option value="">Seleccione...</option>
        {% for t in tipos %}
          <option value="{{ t.id_tipo }}"
            {% if registro and registro.id_tipo|string == t.id_tipo|string %}selected{% endif %}>
            {{ t.nombre }} ({{ t.categoria }})
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="cantidad">Cantidad en kilogramos *</label>
      <input class="form-control" id="cantidad" name="cantidad" type="number" step="0.01" min="0.01" max="1000" required
             value="{{ registro.cantidad if registro else '' }}">
      <div class="form-text">Valor entre 0.01 y 1000 kg.</div>
    </div>
    <div class="col-md-8">
      <label class="form-label" for="observaciones">Observaciones</label>
      <textarea class="form-control" id="observaciones" name="observaciones" rows="3" maxlength="250">{{ registro.observaciones if registro else '' }}</textarea>
    </div>
  </div>
  <hr>
  <button class="btn btn-verde" type="submit">{{ accion }}</button>
  <a class="btn btn-link" href="{{ url_for('listar_registros') }}">Cancelar</a>
</form>
</div></div>
{% endblock %}
